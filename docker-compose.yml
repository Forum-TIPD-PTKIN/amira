services:
  amira_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amira_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8093}:80"
    env_file:
      - .env
    environment:
      - DB_HOST=amira_db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-amira_db}
      - DB_USERNAME=${DB_USERNAME:-amira_user}
      - DB_PASSWORD=${DB_PASSWORD:-amira_password_secure_2026}
    volumes:
      - /home/apps/app-amira/storage:/var/www/html/storage
      - /home/apps/app-amira/.env:/var/www/html/.env
    depends_on:
      amira_db:
        condition: service_healthy
    networks:
      - amira_network

  amira_db:
    image: mariadb:11.4
    container_name: amira_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-amira_root_pass_2026}
      MARIADB_DATABASE: ${DB_DATABASE:-amira_db}
      MARIADB_USER: ${DB_USERNAME:-amira_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-amira_password_secure_2026}
    volumes:
      - /home/apps/app-amira/db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-amira_root_pass_2026}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks:
      - amira_network

networks:
  amira_network:
    name: amira_network
    driver: bridge
